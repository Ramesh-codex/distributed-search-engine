name: Demo cluster smoke test

on:
  push:
    branches: [deployment-demo]
  pull_request:
    branches: [deployment-demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install demo runtime
        run: python -m pip install -r requirements-demo.txt
      - name: Check Python modules
        run: python -m compileall -q src demo
      - name: Check interactive UI contract and JavaScript syntax
        run: python demo/check_ui.py
      - name: Build indexes and test real HTTP cluster
        env:
          PYTHONPATH: src
        run: python demo/smoke_test.py
      - name: Build production-like Render Docker image
        run: docker build --file Dockerfile.render --tag search-demo:ci .
      - name: Verify live HTTP inside Docker
        run: |
          docker run --detach --name search-demo-ci --publish 10000:10000 --env PORT=10000 search-demo:ci
          trap 'docker logs search-demo-ci; docker rm -f search-demo-ci' EXIT
          python demo/verify_http.py --url http://127.0.0.1:10000 --wait 60
