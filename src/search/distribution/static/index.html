<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>distributed-search-engine</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --bg: #ffffff;
    --muted: #666666;
    --border: #dddddd;
    --accent: #1a56db;
    --warn-bg: #fff3cd;
    --warn-fg: #7a4a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8e8e8; --bg: #121212; --muted: #999999; --border: #333333; --accent: #6ea8fe;
      --warn-bg: #4a3900; --warn-fg: #ffdb70;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  form { display: flex; gap: 0.5rem; }
  input[type="search"] {
    flex: 1;
    padding: 0.6rem 0.8rem;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
  }
  button {
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #meta { color: var(--muted); font-size: 0.85rem; margin: 0.75rem 0; min-height: 1.2em; }
  #degraded-banner {
    display: none;
    margin: 0.75rem 0;
    padding: 0.6rem 0.9rem;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    background: var(--warn-bg);
    color: var(--warn-fg);
  }
  #degraded-banner.visible { display: block; }
  ol#results { list-style: none; margin: 0; padding: 0; }
  li.result { padding: 0.9rem 0; border-bottom: 1px solid var(--border); }
  li.result .title { font-size: 1.05rem; }
  li.result .shard {
    display: inline-block;
    margin-left: 0.5rem;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    background: var(--border);
    color: var(--muted);
    font-size: 0.75rem;
    vertical-align: middle;
  }
  li.result .score { color: var(--muted); font-size: 0.8rem; margin-left: 0.5rem; }
  footer { color: var(--muted); font-size: 0.8rem; margin-top: 2rem; }
</style>
</head>
<body>
<main>
  <h1>distributed-search-engine</h1>
  <form id="search-form">
    <input type="search" id="q" name="q" placeholder="Search the corpus..." autofocus autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <div id="degraded-banner"></div>
  <p id="meta"></p>
  <ol id="results"></ol>
  <footer id="corpus-info"></footer>
</main>

<script>
const form = document.getElementById("search-form");
const input = document.getElementById("q");
const meta = document.getElementById("meta");
const banner = document.getElementById("degraded-banner");
const results = document.getElementById("results");
const corpusInfo = document.getElementById("corpus-info");

function shardLabel(shardUrl) {
  try {
    return new URL(shardUrl).host;
  } catch (e) {
    return shardUrl;
  }
}

async function loadStats() {
  try {
    const res = await fetch("/stats");
    if (!res.ok) return;
    const s = await res.json();
    const shards = s.shard_urls.map((url) => {
      const breaker = s.breakers[url];
      const label = shardLabel(url);
      return breaker.state === "closed" ? label : `${label} (${breaker.state})`;
    });
    corpusInfo.textContent = `${s.shard_urls.length} shards: ${shards.join(", ")}`;
  } catch (e) {
    // Stats are a nice-to-have footer, not worth failing the page over.
  }
}

function renderResults(data) {
  results.innerHTML = "";

  const resultWord = data.results.length === 1 ? "result" : "results";
  const shardWord = data.shards_queried === 1 ? "shard" : "shards";
  meta.textContent =
    `${data.results.length} ${resultWord} from ${data.shards_queried} ${shardWord} in ${data.elapsed_ms}ms`;

  if (data.degraded) {
    const failedWord = data.shards_failed.length === 1 ? "shard" : "shards";
    banner.textContent =
      `⚠ Degraded: ${data.shards_failed.length} ${failedWord} unavailable ` +
      `(${data.shards_failed.map(shardLabel).join(", ")}) — results are partial.`;
    banner.classList.add("visible");
  } else {
    banner.classList.remove("visible");
  }

  if (data.results.length === 0) {
    results.innerHTML = "<li class='result'>No results.</li>";
    return;
  }

  for (const r of data.results) {
    const li = document.createElement("li");
    li.className = "result";
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = r.title || `(untitled, doc ${r.doc_id})`;
    const shard = document.createElement("span");
    shard.className = "shard";
    shard.textContent = shardLabel(r.shard);
    const score = document.createElement("span");
    score.className = "score";
    score.textContent = `score ${r.score}`;
    li.append(title, shard, score);
    results.appendChild(li);
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const q = input.value.trim();
  if (!q) return;

  meta.textContent = "Searching...";
  banner.classList.remove("visible");
  results.innerHTML = "";

  try {
    const res = await fetch(`/search?q=${encodeURIComponent(q)}&k=10`);
    if (!res.ok) {
      meta.textContent = `Search failed (${res.status})`;
      return;
    }
    renderResults(await res.json());
  } catch (e) {
    meta.textContent = "Search failed: could not reach the server.";
  }
});

loadStats();
</script>
</body>
</html>
