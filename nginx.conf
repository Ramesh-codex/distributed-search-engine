worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream coordinator {
        # One backend today. Point more `server` lines at additional
        # coordinator container names (or scale this service and list each
        # replica explicitly) to actually load-balance across them.
        server coordinator:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://coordinator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
